repos:
  - repo: local
    hooks:
      - id: private-data-guard
        name: no private data committed
        entry: uv run python scripts/check_no_private_data.py
        language: system
        pass_filenames: false
        always_run: true

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        language: system
        types: [python]
        pass_filenames: false

      - id: ruff-format
        name: ruff format (check)
        entry: uv run ruff format --check .
        language: system
        types: [python]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false

      - id: bandit
        name: bandit
        entry: uv run bandit -r . --exclude ./tests,./build,./.venv
        language: system
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        types: [python]
        pass_filenames: false

      - id: frontend-lint
        name: eslint
        entry: bash -c 'cd frontend && pnpm lint'
        language: system
        files: ^frontend/src/.*\.(vue|ts)$
        pass_filenames: false

      - id: frontend-typecheck
        name: vue-tsc
        entry: bash -c 'cd frontend && pnpm typecheck'
        language: system
        files: ^frontend/src/.*\.(vue|ts)$
        pass_filenames: false
